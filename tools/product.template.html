<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客服工作台 · 同题回放</title>
<style>
:root{--bg:#0d1627;--text:#f4f7ff;--muted:#bdcbe1;--line:#344962;--panel:#162236;--ink:#172943;--success:#08705d;--failure:#a84924}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}
main{width:min(1240px,calc(100% - 40px));margin:24px auto 40px}
h1,h2,h3,p{margin:0}h1{font-size:clamp(26px,5vw,42px);line-height:1.18;letter-spacing:-.03em}.eyebrow{font-size:13px;font-weight:750;color:#9ed8ff;margin-bottom:5px;letter-spacing:.08em}
.sub{margin:7px 0 14px;color:var(--muted)}.tabs,.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
button{border:1px solid #526883;background:#20334b;color:var(--text);padding:8px 14px;border-radius:8px;font:inherit;font-weight:650;cursor:pointer}
button[aria-pressed=true]{background:#b1deff;color:var(--ink);border-color:#b1deff}button:disabled{opacity:.42;cursor:default}
:focus-visible{outline:3px solid #9ed8ff;outline-offset:3px}
.timeline{list-style:none;margin:18px 0 12px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.timeline li{border-top:3px solid #4a607b;color:var(--muted);padding:5px 0;font-size:14px}.timeline [aria-current=step]{border-color:#9ed8ff;color:#f2f8ff;font-weight:750}
.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.lane{background:var(--panel);min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:16px}
.lane-top{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.lane-top h2{font-size:19px}.lane-top span{border-radius:999px;background:#2d4058;padding:4px 10px;white-space:nowrap;font-size:13px;font-weight:750}
.lane-top .failed{background:#55392c;color:#ffceb4}.lane-top .passed{background:#124b42;color:#b5f6de}
.dialogue{padding:10px 16px 11px;background:#1e3047;min-height:97px}.quote{font-size:16px}
.action{color:#c4e3ff;font-size:13px;margin-top:5px;overflow-wrap:anywhere}.action code{color:#a4d5fb}
.desk{display:grid;place-items:center;min-height:312px;margin:0;padding:14px 14px 18px;background:linear-gradient(145deg,#eff5fb,#dce8f4);color:var(--ink)}
.surface{width:100%;max-width:470px;border-radius:12px;background:white;overflow:hidden;box-shadow:0 6px 19px #182f4a24;border:1px solid #cddbec}
.surface h3{font-size:15px;padding:11px 14px;background:#f1f6fc}.surface p{margin:0}
.phone{width:min(285px,100%);border:7px solid #263b54;border-radius:23px;box-shadow:0 8px 18px #1d3a603b}
.phone h3{padding:8px 14px}.phone-body{padding:9px 14px 11px}
.network{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;font-size:20px;font-weight:750}
.bars{height:23px;display:flex;align-items:end;gap:4px}.bars i{display:block;width:5px;border-radius:2px;background:#bbc8d6}.bars i:nth-child(1){height:7px}.bars i:nth-child(2){height:12px}.bars i:nth-child(3){height:17px}.bars i:nth-child(4){height:23px}.online .bars i{background:#139575}
.row{padding:8px 0;border-top:1px solid #e1e9f2;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.row span:first-child{color:#52647b}.row strong{font-size:14px}
.meter{height:6px;background:#e5ecf6;border-radius:8px;overflow:hidden;margin-bottom:4px}.meter i{display:block;height:100%;background:#dc683a}
.speed{display:flex;justify-content:space-between;align-items:center;padding-top:7px;border-top:1px solid #e1e9f2}.speed strong{font-size:19px}
.order{display:grid;grid-template-columns:41px 1fr auto;align-items:center;gap:11px;padding:15px 13px;border-top:1px solid #e4edf6}
.item-icon,.plane-icon{display:grid;place-items:center;width:37px;height:37px;background:#eef4fd;color:#315783;border-radius:8px;font-size:22px}.order small,.flight small{display:block;color:#536882;font-size:12px}
.tag{border-radius:999px;padding:4px 9px;font-weight:750;font-size:13px;white-space:nowrap;background:#e7edf6;color:#496079}.good{background:#d8f4e9;color:var(--success)}.bad{color:var(--failure)}
.ticket{padding:16px 14px}.route{display:flex;justify-content:space-between;align-items:center;font-size:clamp(24px,4vw,37px);font-weight:800}
.route span:first-child,.route span:last-child{min-width:72px}.route span:last-child{text-align:right}.route .plane-icon{font-size:18px}
.flight{display:flex;justify-content:space-between;align-items:center;padding:12px 0 0;margin-top:10px;border-top:1px dashed #a1afc2;font-size:15px}
.booking{padding:10px 14px;background:#eef4fc;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.controls{margin-top:13px}.controls input{flex:1;min-width:100px;accent-color:#a7dcff}
.legend,details{color:var(--muted);font-size:13px;margin-top:9px;overflow-wrap:anywhere}details summary{cursor:pointer}details code{display:block}
.capture main{margin-top:22px}.capture .tabs,.capture .controls,.capture details{display:none}.capture .dialogue{min-height:86px}
@media(max-width:670px){main{width:calc(100% - 24px);margin-top:14px}.comparison{grid-template-columns:1fr}.timeline li{font-size:11px}.lane-top h2{font-size:16px}.desk{min-height:0}}
</style>
<main>
<div class="eyebrow" id="domain">τ²-BENCH</div>
<h1 id="title"></h1>
<p class="sub">同一任务 · 同一模拟用户 · 实测轨迹重建</p>
<nav class="tabs" id="tabs" aria-label="选择业务域"></nav>
<ol class="timeline" id="timeline" aria-label="回放阶段"></ol>
<section class="comparison" aria-label="原始模型与优化模型并排对照">
  <article class="lane"><div class="lane-top"><h2>原始 Qwen3.5-2B</h2><span id="score0"></span></div><div id="dialogue0" class="dialogue"></div><div class="desk" id="desk0"></div></article>
  <article class="lane"><div class="lane-top"><h2>SFT＋GRPO＋手册</h2><span id="score1"></span></div><div id="dialogue1" class="dialogue"></div><div class="desk" id="desk1"></div></article>
</section>
<div class="controls">
 <button id="prev" type="button">上一步</button><button id="play" type="button">播放</button><button id="next" type="button">下一步</button>
 <input id="seek" type="range" min="0" max="3" value="0" aria-label="跳转回放阶段">
</div>
<p class="legend" id="legend"></p>
<details><summary>任务与轨迹索引</summary><p id="task"></p><p id="refs"></p><code id="hash0"></code><code id="hash1"></code></details>
</main>
<script id="replay-data" type="application/json">__REPLAY_DATA__</script>
<script>
const {cases,scenes}=JSON.parse(document.getElementById("replay-data").textContent);
const $=id=>document.getElementById(id);
const query=new URLSearchParams(location.search);
let index=Math.max(0,cases.findIndex(c=>c.id===query.get("case")));
let stage=Math.min(3,Math.max(0,Number.parseInt(query.get("step"),10)||0)),timer=null;
if(query.get("capture")==="1")document.body.classList.add("capture");
function el(tag,text,cls){
 const node=document.createElement(tag);
 if(text!==undefined)node.textContent=text;
 if(cls)node.className=cls;
 return node;
}
function append(node,...children){node.append(...children);return node;}
const tabs=cases.map((c,i)=>{
 const button=el("button",c.domain);
 button.type="button";button.onclick=()=>{stop();index=i;stage=0;render();};$("tabs").append(button);return button;
});
function badge(text,ok){return el("span",text,"tag"+(ok?" good":""));}
function row(name,value){return append(el("div",undefined,"row"),el("span",name),el("strong",value));}
function mobile([status,usage,topup,speed]){
 const bar=append(el("div",undefined,"bars"),...Array.from({length:4},()=>el("i")));
 bar.setAttribute("aria-hidden","true");
 const connected=status==="已联网";
 const header=append(el("div",undefined,"network"+(connected?" online":"")),el("strong",status,connected?"":"bad"),bar);
 const meter=append(el("div",undefined,"meter"),el("i"));
 if(usage==="未检查")meter.firstChild.style.width="0";
 const speedMeter=append(el("div",undefined,"speed"),el("span","测速"),el("strong",speed,speed==="测速失败"?"bad":""));
 const inside=append(el("div",undefined,"phone-body"),header,row("套餐流量",usage),meter,row("补充流量",topup),speedMeter);
 return append(el("div",undefined,"surface phone"),el("h3","手机 · 移动网络"),inside);
}
function orders(states){
 const board=append(el("div",undefined,"surface"),el("h3","订单后台 · 退货状态"));
 [["⌨","机械键盘"],["◉","游戏鼠标"]].forEach(([icon,name],i)=>{
  const desc=append(el("div"),el("strong",name),el("small","订单 "+(i?"B":"A")));
  board.append(append(el("div",undefined,"order"),el("span",icon,"item-icon"),desc,badge(states[i],states[i]!=="未提交")));
 });
 return board;
}
function itinerary([flight,status]){
 const route=append(el("div",undefined,"route"),el("span","ORD"),el("span","✈","plane-icon"),el("span","PHL"));
 const ticket=append(el("div",undefined,"ticket"),route,append(el("div",undefined,"flight"),el("span","匹配的历史航班"),el("strong",flight)));
 return append(el("div",undefined,"surface"),el("h3","预订后台 · 单程行程"),ticket,
  append(el("div",undefined,"booking"),el("span","新预订"),badge(status,status!=="尚未创建")));
}
const renderer={telecom:mobile,retail:orders,airline:itinerary};
function render(){
 const item=cases[index],scene=scenes[item.id];
 $("domain").textContent="τ²-BENCH  /  "+item.domain.toUpperCase();
 $("title").textContent=scene.title;
 tabs.forEach((button,i)=>button.setAttribute("aria-pressed",String(i===index)));
 $("timeline").replaceChildren(...scene.timeline.map((label,i)=>{
  const node=el("li",(i+1)+" · "+label);
  if(i===stage)node.setAttribute("aria-current","step");
  return node;
 }));
 for(let lane=0;lane<2;lane++){
  const [quote,action,...state]=scene.lanes[lane][stage];
  const tool=item.beats[stage][lane?4:2];
  $("dialogue"+lane).replaceChildren(el("div",quote,"quote"),
   append(el("div",undefined,"action"),el("span",action+" · "),el("code",tool)));
  $("desk"+lane).replaceChildren(renderer[item.id](state));
  const score=$("score"+lane);
  score.className=stage<3?"":lane?"passed":"failed";
  score.textContent=stage<3?"回放中":lane?"通过 · 1 分":"未通过 · 0 分";
  $("hash"+lane).textContent=(lane?"优化":"原始")+"轨迹 SHA-256 "+item.hashes[lane];
 }
 $("legend").textContent=scene.legend+" 对话为摘要，界面为状态重建。";
 $("task").textContent="官方任务 ID："+item.task;$("refs").textContent=item.refs.join(" ");
 $("seek").value=stage;$("prev").disabled=stage===0;$("next").disabled=stage===3;
}
function stop(){clearInterval(timer);timer=null;$("play").textContent="播放";}
function move(delta){stage=Math.max(0,Math.min(3,stage+delta));render();}
$("prev").onclick=()=>{stop();move(-1);};$("next").onclick=()=>{stop();move(1);};
$("seek").oninput=event=>{stop();stage=Number(event.target.value);render();};
$("play").onclick=()=>{
 if(timer){stop();return;}
 if(stage===3){stage=0;render();}
 $("play").textContent="暂停";
 timer=setInterval(()=>{move(1);if(stage===3)stop();},2400);
};
render();
</script>
</html>
