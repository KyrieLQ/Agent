<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>τ²-bench · 同题轨迹回放</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1220;color:#eef4ff;font:16px/1.6 system-ui,sans-serif}
main{width:min(1100px,calc(100% - 32px));margin:36px auto 52px}
h1{font-size:clamp(28px,5vw,46px);line-height:1.15;margin:10px 0 15px}
p{margin:8px 0;color:#b8c7dd}.tabs,.control{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;padding:9px 15px;background:#17283e;color:#eef4ff;border:1px solid #4a617c;border-radius:9px;cursor:pointer}
button[aria-pressed=true]{background:#a7dcff;color:#0a1220;border-color:#a7dcff;font-weight:700}button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #a7dcff;outline-offset:3px}
.case{margin-top:23px;background:#101c2e;border:1px solid #30445d;border-radius:17px;padding:20px}
h2,h3{margin:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
article{min-height:180px;padding:17px;border:1px solid #415670;border-radius:12px;background:#142238}
.failure{color:#ffb3a7}.success{color:#9cebd3}.state{font-size:14px;color:#b8c7dd}
code{display:inline-block;overflow-wrap:anywhere;color:#a7dcff;margin-top:10px}.control input{flex:1;min-width:100px;accent-color:#a7dcff}
summary{cursor:pointer}details code{display:block;font-size:12px}
@media(max-width:620px){main{margin-top:20px}.pair{grid-template-columns:1fr}article{min-height:0}}
</style>
<main>
<h1>同一道客服任务，两条轨迹</h1>
<p>从同轮实测中挑选的三个案例。以关键步骤对齐，内容为轨迹摘要。</p>
<nav class="tabs" id="tabs" aria-label="选择业务域"></nav>
<section class="case">
<h2 id="title"></h2><p id="request"></p><p id="beat" aria-live="polite"></p>
<div class="pair">
<article><h3 class="failure">原始 Qwen3.5-2B</h3><div class="state" id="base-score"></div><code id="base-tool"></code><p id="base-text"></p></article>
<article><h3 class="success">SFT＋GRPO＋静态手册</h3><div class="state" id="new-score"></div><code id="new-tool"></code><p id="new-text"></p></article>
</div>
<div class="control">
<button id="prev" type="button">上一步</button><button id="play" type="button">播放</button><button id="next" type="button">下一步</button>
<input id="seek" type="range" min="0" step="1" aria-label="关键步骤">
</div>
</section>
<details><summary>任务标识与轨迹索引</summary><p id="task"></p><p id="refs"></p><code id="hash0"></code><code id="hash1"></code></details>
</main>
<script id="case-data" type="application/json">[{"id": "telecom", "domain": "Telecom", "task": "[mobile_data_issue]airplane_mode_on|bad_network_preference|data_usage_exceeded|user_abroad_roaming_disabled_off[PERSONA:Easy]", "title": "恢复漫游中的移动数据", "en": "Restore mobile data while roaming", "request": "用户在境外，移动数据无法使用或很慢，希望恢复连接。", "steps": [62, 44], "hashes": ["80a627de4e1f44e6858a899df6519aead28b2b1a0b76b98a4f03c0566a29d956", "587e73acf3749b031b181b30b8657ae8abae8a24da8b96239afacad5058dce99"], "beats": [["1 · Locate the line", "先核对客户和线路", "get_details_by_id", "Checked the line and enabled carrier roaming.", "get_details_by_id", "Checked the line and enabled carrier roaming."], ["2 · Diagnose the blockers", "定位剩余限制", "run_speed_test", "Changed network settings; selected speed test still showed no connection.", "get_data_usage", "Checked the quota early: 15.1 GB used against a 15.0 GB limit."], ["3 · Change the state", "执行并复核", "get_data_usage", "Only checked usage near the end. The trace contains no data top-up.", "refuel_data", "Added 2 GB, corrected device settings, and verified 275 Mbps."], ["4 · Official outcome", "官方评分", "MAX_STEPS", "Reward 0. The trajectory reached its step limit without restoring service.", "USER_STOP", "Reward 1. Device speed test verified the recovered connection."]], "refs": ["Baseline: speed tests at messages 32, 46, 56; quota at 59.", "Optimized: quota at message 15; top-up at 23; speed test at 42."]}, {"id": "retail", "domain": "Retail", "task": "14", "title": "为两笔订单提交退货", "en": "Submit two returns", "request": "用户确认退回机械键盘和游戏鼠标，两件商品来自不同订单。", "steps": [16, 24], "hashes": ["2f52d2aeaf39d3391cef64d175bc3c843ba36b11a70f4fcd6ba7d305ee96b1dd", "0480658597ab05750547bb915c48b03f616500b0032f01cb922063cf61d93ed8"], "beats": [["1 · Verify identity", "验证用户", "find_user_id_by_email", "Located the customer account by email.", "find_user_id_by_email", "Located the customer account by email."], ["2 · Inspect the orders", "检查两笔订单", "get_order_details", "Checked both orders and identified the items to return.", "get_order_details", "Checked both orders and identified the items to return."], ["3 · Submit the returns", "获得确认后提交", "No write call", "The conversation ended after confirmation. No return tool ran.", "return_delivered_order_items", "Submitted a return for each order. Both tools returned 'return requested'."], ["4 · Official outcome", "官方评分", "0 return requests", "Reward 0. The two requested updates were missing.", "2 return requests", "Reward 1. Both order states recorded a return request."]], "refs": ["Baseline: order lookups at messages 9 and 11; no return call in the complete trace.", "Optimized: return tool calls at messages 19 and 21; both returned status 'return requested'."]}, {"id": "airline", "domain": "Airline", "task": "8", "title": "找到历史航班并完成订票", "en": "Find and rebook a past flight", "request": "用户希望订购同一条航线、与历史行程相同的航班，供两位乘客出行。", "steps": [20, 26], "hashes": ["8f10a4d07c2707af77da6af41efbab44fc36584000355d4609a20695fe74ab9c", "f1c59058b149a96d64bca2752165b0bed9717e139e5a44ff894f9dc03b2b54a6"], "beats": [["1 · Identify the customer", "识别用户", "get_user_details", "Retrieved the customer's account.", "get_user_details", "Retrieved the customer's account."], ["2 · Find the past flight", "找到历史航班", "search_direct_flight", "Repeated flight searches without opening the prior reservations.", "get_reservation_details", "Opened historical reservations and identified the matching flight."], ["3 · Create the booking", "提交预订", "No booking call", "The simulator requested a human handoff. No booking was written.", "book_reservation", "Created the matching one-way booking for two passengers."], ["4 · Official outcome", "官方评分", "0 bookings", "Reward 0. No matching booking was created.", "1 matching booking", "Reward 1. The simulator confirmed the booking."]], "refs": ["Baseline: searches at messages 5, 7, 11 and 13; no booking call in the complete trace.", "Optimized: reservation reads at messages 7–15 and booking at message 23; tool result contained two passengers."]}]</script>
<script>
const cases=JSON.parse(document.getElementById('case-data').textContent);
const byId=id=>document.getElementById(id);
let index=0,step=0,timer=null;
const tabs=cases.map((item,i)=>{
  const tab=document.createElement('button');
  tab.type='button';tab.textContent=item.domain;
  tab.onclick=()=>{stop();index=i;step=0;render();};
  byId('tabs').append(tab);return tab;
});
function put(id,value){byId(id).textContent=value;}
function stop(){clearInterval(timer);timer=null;put('play','播放');}
function render(){
  const item=cases[index], max=item.beats.length-1;
  const [heading,label,baseTool,baseText,newTool,newText]=item.beats[step];
  tabs.forEach((tab,i)=>tab.setAttribute('aria-pressed',String(i===index)));
  put('title',item.title);put('request',item.request);put('beat',(step+1)+' / '+(max+1)+' · '+label);
  put('base-score','官方评分 0 · '+item.steps[0]+' 步');
  put('new-score','官方评分 1 · '+item.steps[1]+' 步');
  put('base-tool',baseTool);put('base-text',baseText);put('new-tool',newTool);put('new-text',newText);
  byId('seek').max=max;byId('seek').value=step;
  byId('prev').disabled=step===0;byId('next').disabled=step===max;
  put('task','官方任务 ID：'+item.task);put('refs',item.refs.join(' '));
  put('hash0','原始轨迹 SHA-256 '+item.hashes[0]);put('hash1','优化轨迹 SHA-256 '+item.hashes[1]);
}
function move(delta){
  step=Math.max(0,Math.min(cases[index].beats.length-1,step+delta));render();
}
byId('prev').onclick=()=>{stop();move(-1);};
byId('next').onclick=()=>{stop();move(1);};
byId('seek').oninput=event=>{stop();step=Number(event.target.value);render();};
byId('play').onclick=()=>{
  if(timer){stop();return;}
  if(step===cases[index].beats.length-1){step=0;render();}
  put('play','暂停');
  timer=setInterval(()=>{move(1);if(step===cases[index].beats.length-1)stop();},2200);
};
render();
</script>
</html>
